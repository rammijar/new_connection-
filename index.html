<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Standard Package Prices for New Connection</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #1e1e1e;
    color: #f1f1f1;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 900px;
    margin: auto;
    background: #2a2a2a;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px #000;
}
h2 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: normal;
}
select {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 6px;
    border: none;
    font-size: 15px;
    background: #333;
    color: #f1f1f1;
}
.table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}
.table th, .table td {
    border: 1px solid #444;
    padding: 8px;
    text-align: left;
}
.table th { background: #333; }
.total {
    font-weight: bold;
    font-size: 16px;
    color: #4caf50;
}
.note {
    font-size: 13px;
    color: #ffcc80;
    margin-top: 4px;
}
textarea {
    width: 100%;
    height: 200px;
    margin-top: 12px;
    padding: 10px;
    font-size: 14px;
    border-radius: 6px;
    border: none;
    resize: none;
    background: #333;
    color: #f1f1f1;
}
button {
    margin-top: 10px;
    padding: 12px;
    width: 100%;
    background: #4caf50;
    color: #000;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background: #45a049;
}
</style>
</head>

<body>
<div class="container">
    <h2>Standard Package Prices for New Connection</h2>

    <select id="speed">
        <option value="200">200 Mbps</option>
        <option value="250">250 Mbps</option>
        <option value="300">300 Mbps</option>
    </select>

    <select id="duration">
        <option value="1">1 Month</option>
        <option value="3">3 Months</option>
        <option value="12">12 Months</option>
    </select>

    <select id="stb">
        <option value="0">No STB</option>
        <option value="1">1 STB</option>
        <option value="2">2 STB</option>
        <option value="3">3 STB</option>
    </select>

    <select id="beacon">
        <option value="0">No Beacon</option>
        <option value="1">1 Beacon</option>
        <option value="2">2 Beacons</option>
    </select>

    <table class="table" id="result"></table>
    <div id="notes"></div>
    <textarea id="remark" readonly></textarea>
    <button id="copyBtn">Copy Remark</button>
</div>

<script>
// ---------- DATA ----------
const internet = {200:{1:1469,3:3729,12:14238},250:{1:1639,3:4068,12:15594},300:{1:1752,3:4577,12:17628}};
const routerCharge = {1:1695,3:0,12:0};
const dropWire = {1:1130,3:0,12:0};
const primaryAct = {1:2260,3:1695,12:0};
const secondaryAct = {1:2260,3:2260,12:2260};
const tertiaryAct = {1:2260,3:2260,12:2260};
const stbDeposit = 1000;
const beaconActivation = {1:2825,3:2825,12:2825};
const beaconDeposit = 1500;

// ---------- ELEMENTS ----------
const speedEl = document.getElementById("speed");
const durationEl = document.getElementById("duration");
const stbEl = document.getElementById("stb");
const beaconEl = document.getElementById("beacon");
const resultEl = document.getElementById("result");
const notesEl = document.getElementById("notes");
const remarkEl = document.getElementById("remark");
const copyBtn = document.getElementById("copyBtn");

// ---------- LOGIC ----------
function calc(){
    const s = speedEl.value;
    const d = durationEl.value;
    const stbCount = parseInt(stbEl.value);
    const beaconCount = parseInt(beaconEl.value);

    let total = 0;
    let table = `<tr><th>Charge Type</th><th>Amount (Rs.)</th></tr>`;
    let notes = "";
    let remark = `Plan: ${s} Mbps / ${d} Month(s)\n--------------------------------`;

    function addRow(label, value){
        table += `<tr><td>${label}</td><td>${value}</td></tr>`;
        total += value;
        remark += `\n${label}: Rs. ${value}`;
    }

    addRow("Internet Usage Charge", internet[s][d]);
    addRow("Dual Band Router Charge", routerCharge[d]);
    addRow("Drop Wire / Installation", dropWire[d]);
    addRow("Refundable Internet Deposit", 1000);

    if(stbCount >= 1){
        addRow("Primary STB Activation", primaryAct[d]);
        addRow("Primary STB Deposit", stbDeposit);
        notes += `<div class="note">STB Cable Charge: Rs.35 per meter (as applicable)</div>`;
        remark += `\nNote: STB Cable Charge Rs.35 per meter`;
    }
    if(stbCount >= 2){
        addRow("Secondary STB Activation", secondaryAct[d]);
        addRow("Secondary STB Deposit", stbDeposit);
    }
    if(stbCount === 3){
        addRow("Tertiary STB Activation", tertiaryAct[d]);
        addRow("Tertiary STB Deposit", stbDeposit);
    }

    if(beaconCount >= 1){
        addRow("Primary Beacon Activation", beaconActivation[d]);
        addRow("Primary Beacon Deposit", beaconDeposit);
        notes += `<div class="note">Beacon Cable Charge: Rs.50 per meter</div>
                  <div class="note">Max 2 Beacons allowed</div>`;
        remark += `\nNote: Beacon Cable Charge Rs.50 per meter\nNote: Maximum 2 Beacons allowed`;
    }
    if(beaconCount === 2){
        addRow("Secondary Beacon Activation", beaconActivation[d]);
        addRow("Secondary Beacon Deposit", beaconDeposit);
    }

    table += `<tr class="total"><td>Grand Total</td><td>${total}</td></tr>`;
    remark += `\n--------------------------------\nGrand Total: Rs. ${total}`;

    resultEl.innerHTML = table;
    notesEl.innerHTML = notes;
    remarkEl.value = remark.trim();
}

// ---------- EVENTS ----------
[speedEl, durationEl, stbEl, beaconEl].forEach(el => el.addEventListener("change", calc));
copyBtn.addEventListener("click", () => { remarkEl.select(); document.execCommand("copy"); });

// Init
calc();
</script>
</body>
</html>
